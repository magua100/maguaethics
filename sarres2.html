<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magua Sarees</title>

<link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#5e3984;

    min-height:100vh;

    padding:30px 15px;

    font-family:Arial,sans-serif;
}

/* Heading */

.page-title{

    text-align:center;

    color:white;

    font-family:'Azonix',sans-serif;

    font-size:26px;

    letter-spacing:4px;

    margin-bottom:35px;
}

.page-subtitle{

    text-align:center;

    color:#f8e7ff;

    margin-bottom:40px;

    font-size:15px;
}

/* Showcase */

.saree-showcase{

    width:100%;

    max-width:950px;

    margin:auto;
}

/* Cards */

.big-card,
.small-card{

    position:relative;

    overflow:hidden;

    border-radius:24px;

    box-shadow:
    0 15px 35px rgba(0,0,0,.18);
}

/* Large */

.big-card{

    height:320px;

    margin-bottom:20px;
}

/* Two Grid */

.two-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:20px;
}

/* Small */

.small-card{

    height:240px;
}

/* Images */

.big-card img,
.small-card img{

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:top center;

    transition:.5s ease;
}

/* Overlay */

.overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:flex-end;

    padding:22px;

    background:
    linear-gradient(
    to top,
    rgba(0,0,0,.72),
    rgba(0,0,0,.12),
    transparent);
}

.overlay h3{

    color:white;

    font-family:'Azonix',sans-serif;

    font-size:14px;

    letter-spacing:1px;
}

/* Hover */

.big-card:hover img,
.small-card:hover img{

    transform:scale(1.08);
}

/* Mobile */

@media(max-width:768px){

    .page-title{

        font-size:16px;

        letter-spacing:2px;
    }

    .page-subtitle{

        font-size:12px;
    }

    .big-card{

        height:220px;
    }

    .small-card{

        height:180px;
    }

    .two-grid{

        gap:12px;
    }

    .overlay{

        padding:14px;
    }

    .overlay h3{

        font-size:10px;
    }
}
.big-card,
.small-card{

    opacity:0;

    transform:
        translateY(60px)
        scale(.92);

    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.22,1,.36,1);
}

.big-card.show,
.small-card.show{

    opacity:1;

    transform:
        translateY(0)
        scale(1);
}
.big-card.show{
    transition-delay:.1s;
}

.small-card.show{
    transition-delay:.2s;
}
</style>
</head>
<body>

<h1 class="page-title">MAGUA SAREES</h1>

<div class="page-subtitle">
Discover Timeless Elegance
</div>

<div class="saree-showcase">

    <!-- 1 -->
    <div class="big-card">

        <img src="saresss/banarass.avif" alt="">

        <div class="overlay">
            <h3>BANARASI SAREES</h3>
        </div>

    </div>

    <!-- 2 & 3 -->

    <div class="two-grid">

        <div class="small-card">

            <img src="saresss/korrra.webp" alt="">

            <div class="overlay">
                <h3>KORA TISSUE</h3>
            </div>

        </div>

        <div class="small-card">

            <img src="sarees/kota.jpg" alt="">

            <div class="overlay">
                <h3>KOTA SILK</h3>
            </div>

        </div>

    </div>

    <!-- 4 -->

    <div class="big-card">

        <img src="sarees/kanchipuram.jpg" alt="">

        <div class="overlay">
            <h3>KANCHIPURAM SAREES</h3>
        </div>

    </div>

    <!-- 5 & 6 -->

    <div class="two-grid">

        <div class="small-card">

            <img src="sarees/linen.jpg" alt="">

            <div class="overlay">
                <h3>LINEN SAREES</h3>
            </div>

        </div>

        <div class="small-card">

            <img src="sarees/tissue.jpg" alt="">

            <div class="overlay">
                <h3>TISSUE SAREES</h3>
            </div>

        </div>

    </div>

</div>
<script>

const cards = document.querySelectorAll(
    ".big-card,.small-card"
);

const observer = new IntersectionObserver(

(entries)=>{

    entries.forEach((entry)=>{

        if(entry.isIntersecting){

            entry.target.classList.add("show");

            observer.unobserve(entry.target);
        }

    });

},

{
    threshold:0.15
}

);

cards.forEach((card)=>{

    observer.observe(card);

});

</script>
</body>
</html>
