<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magua Sarees</title>

<link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    background:#5e3984;

    font-family:Arial,sans-serif;
}
/* NAVBAR */

.top-bar{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    height:70px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:18px;

    z-index:1000;
}

.top-left{
    position:absolute;
    top:50%;
    left:20px;
    transform:translateY(-50%);
}

.nav-logo-video{
    width:60px;
    height:60px;
    object-fit:contain;
}

.top-right{
    position:absolute;
    top:50%;
    right:20px;
    transform:translateY(-50%);
}

.switch{
    position:relative;

    width:98px;
    height:36px;

    background:rgba(255,255,255,0.12);

    border-radius:50px;

    display:flex;
    align-items:center;

    padding:3px;

    cursor:pointer;
}

.switch-circle{
    position:absolute;

    width:42px;
    height:30px;

    background:white;

    border-radius:50px;

    left:3px;

    transition:.3s ease;
}

.switch-text{
    position:relative;

    width:100%;

    display:flex;

    z-index:2;
}

.switch-text span{
    width:50%;

    text-align:center;

    line-height:30px;

    font-size:10px;

    font-weight:600;
}

#englishBtn{
    color:#5e3984;
}

#teluguBtn{
    color:white;
}

/* PAGE CONTENT */

.hero{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:100px 20px 20px;
}

.hero h1{
    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    margin-bottom:25px;

    text-align:center;
}

.hero p{
    max-width:900px;

    text-align:center;

    color:#f8e7ff;

    font-size:18px;

    line-height:2;
}

/* MOBILE */

@media(max-width:768px){

    .top-bar{
        height:60px;
    }

    .nav-logo-video{
        width:50px;
        height:50px;
    }

    .hero h1{
        font-size:22px;
        letter-spacing:2px;
    }

    .hero p{
        font-size:13px;
        line-height:1.8;
    }

    .switch{
        width:90px;
        height:34px;
    }
}
.hero-title{

    margin-top:110px; /* below navbar */

    text-align:center;

    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    width:100%;
}

@media(max-width:768px){

    .hero-title{

        margin-top:90px;

        font-size:24px;

        letter-spacing:2px;
    }
}
.typing-paragraph{

    width:90%;
    max-width:1000px;

    margin:35px auto 60px;

    color:#f8e7ff;

    font-size:18px;

    line-height:2.1;

    text-align:justify;

    text-indent:40px;
}


@media(max-width:768px){

    .typing-paragraph{

        width:92%;

        font-size:13px;

        line-height:1.9;

        text-indent:25px;
    }
}
.typing-paragraph{
    white-space:pre-wrap;
}
.switch-text{
    position:relative;
    z-index:5;
}

.switch-text span{
    cursor:pointer;
    user-select:none;
}
.nav-logo-img{
    width:60px;
    height:60px;

    object-fit:contain;

    display:block;
}

@media(max-width:768px){

    .nav-logo-img{
        width:45px;
        height:45px;
    }

}
</style>
</head>
<body>

<!-- NAVBAR -->

<div class="top-bar">

    <div class="top-left">

       <img
    class="nav-logo-img"
    src="magualogo.webp"
    alt="MAGUA ETHNICS"
>

    </div>

    <div class="top-right">

        <div class="switch" id="langSwitch">

            <div class="switch-circle"></div>

            <div class="switch-text">
                <span id="englishBtn">ENG</span>
                <span id="teluguBtn">తెలుగు</span>
            </div>

        </div>

    </div>

</div>
<div class="hero-title">
    BOUTIQUE
</div>
<div class="typing-paragraph">
    <span id="typingText"></span>
</div>
<script>

const englishText = `Magua Ethnics is a destination where tradition meets modern elegance. Our boutique is dedicated to bringing carefully curated collections of sarees, designer wear, lehengas, dress materials, jewellery, and fashion essentials that celebrate every woman’s unique style. Every collection is selected with attention to quality, craftsmanship, comfort, and timeless beauty.

From luxurious Banarasi and Kanchipuram sarees to contemporary designer collections, we offer styles that suit weddings, festivals, family celebrations, and special occasions. Our boutique showcases rich fabrics, vibrant colours, intricate embroidery, and elegant detailing that reflect both heritage and modern fashion trends.

At Magua Ethnics, we believe fashion is a form of self-expression. Whether you are looking for a graceful traditional look or a stylish contemporary outfit, our collections are designed to make every moment memorable. We take pride in offering premium designs that inspire confidence, elegance, and individuality.

Beyond clothing, our carefully selected jewellery collections complement every outfit with sophistication and charm. From statement necklaces and bridal sets to elegant accessories, every piece is chosen to complete your perfect look.

Our mission is to create a boutique experience that blends quality, style, and tradition. Every product reflects our passion for fashion and our commitment to helping women look and feel their best. Discover the beauty of timeless ethnic fashion with Magua Ethnics, where every collection tells a story of elegance, culture, and confidence.`;
const teluguText = `మగువ ఎథ్నిక్స్ అనేది సంప్రదాయం మరియు ఆధునిక ఫ్యాషన్ కలిసే ప్రత్యేకమైన బోటిక్. మా బోటిక్‌లో చీరలు, డిజైనర్ డ్రెస్సులు, లెహంగాలు, డ్రెస్సు మెటీరియల్స్, జ్యువెలరీ మరియు ఫ్యాషన్ కలెక్షన్లు అందుబాటులో ఉన్నాయి. ప్రతి కలెక్షన్ నాణ్యత, అందం మరియు ప్రత్యేకతను దృష్టిలో ఉంచుకొని ఎంపిక చేయబడుతుంది.

వివాహాలు, పండుగలు, కుటుంబ వేడుకలు మరియు ప్రత్యేక సందర్భాల కోసం అనువైన అద్భుతమైన కలెక్షన్లను మేము అందిస్తున్నాము. బనారసీ, కంచిపట్టు, డిజైనర్ చీరలు మరియు ఆధునిక ఫ్యాషన్ స్టైల్స్‌తో కూడిన మా కలెక్షన్లు ప్రతి మహిళకు ప్రత్యేకమైన అందాన్ని అందిస్తాయి.

మగువ ఎథ్నిక్స్‌లో ఫ్యాషన్ అనేది కేవలం దుస్తులు మాత్రమే కాదు, అది వ్యక్తిత్వాన్ని ప్రతిబింబించే ఒక కళ. సంప్రదాయ శోభను ఆధునిక శైలితో కలిపి ప్రతి మహిళ ఆత్మవిశ్వాసంగా మరియు అందంగా కనిపించేలా మా డిజైన్లు రూపొందించబడతాయి.

దుస్తులతో పాటు అందమైన జ్యువెలరీ కలెక్షన్లు కూడా అందుబాటులో ఉన్నాయి. నెక్లెస్‌లు, చెవిపోగులు, వడ్డాణాలు, బ్రైడల్ సెట్లు మరియు ఇతర ఆభరణాలు ప్రతి దుస్తుకు మరింత అందాన్ని జోడిస్తాయి.

నాణ్యత, విశ్వసనీయత మరియు ప్రత్యేకమైన ఫ్యాషన్ అనుభవాన్ని అందించడం మా లక్ష్యం. మగువ ఎథ్నిక్స్‌లో ప్రతి కలెక్షన్ అందం, సంప్రదాయం మరియు ఆత్మవిశ్వాసానికి ప్రతీకగా నిలుస్తుంది.`;
let typingTimer;

function startTyping(text){

    clearTimeout(typingTimer);

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    let i = 0;

    function type(){

        if(i < text.length){

            typingBox.innerHTML += text.charAt(i);

            i++;

            typingTimer = setTimeout(type,12);
        }

    }

    type();
}

/* Page Load */

window.onload = function(){

    startTyping(englishText);

};

/* Language Switch */

const englishBtn = document.getElementById("englishBtn");
const teluguBtn = document.getElementById("teluguBtn");
const circle = document.querySelector(".switch-circle");

let isEnglish = true;

document.getElementById("langSwitch").addEventListener("click",function(){

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    if(isEnglish){

        circle.style.left = "48px";

        englishBtn.style.color = "white";
        teluguBtn.style.color = "#5e3984";

        startTyping(teluguText);

    }else{

        circle.style.left = "3px";

        englishBtn.style.color = "#5e3984";
        teluguBtn.style.color = "white";

        startTyping(englishText);
    }

    isEnglish = !isEnglish;

});

</script>
</body>
</html>
