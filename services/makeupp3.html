<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magua Sarees</title>

<link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    background:#5e3984;

    font-family:Arial,sans-serif;
}
/* NAVBAR */

.top-bar{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    height:70px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:18px;

    z-index:1000;
}

.top-left{
    position:absolute;
    top:50%;
    left:20px;
    transform:translateY(-50%);
}

.nav-logo-video{
    width:60px;
    height:60px;
    object-fit:contain;
}

.top-right{
    position:absolute;
    top:50%;
    right:20px;
    transform:translateY(-50%);
}

.switch{
    position:relative;

    width:98px;
    height:36px;

    background:rgba(255,255,255,0.12);

    border-radius:50px;

    display:flex;
    align-items:center;

    padding:3px;

    cursor:pointer;
}

.switch-circle{
    position:absolute;

    width:42px;
    height:30px;

    background:white;

    border-radius:50px;

    left:3px;

    transition:.3s ease;
}

.switch-text{
    position:relative;

    width:100%;

    display:flex;

    z-index:2;
}

.switch-text span{
    width:50%;

    text-align:center;

    line-height:30px;

    font-size:10px;

    font-weight:600;
}

#englishBtn{
    color:#5e3984;
}

#teluguBtn{
    color:white;
}

/* PAGE CONTENT */

.hero{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:100px 20px 20px;
}

.hero h1{
    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    margin-bottom:25px;

    text-align:center;
}

.hero p{
    max-width:900px;

    text-align:center;

    color:#f8e7ff;

    font-size:18px;

    line-height:2;
}

/* MOBILE */

@media(max-width:768px){

    .top-bar{
        height:60px;
    }

    .nav-logo-video{
        width:50px;
        height:50px;
    }

    .hero h1{
        font-size:22px;
        letter-spacing:2px;
    }

    .hero p{
        font-size:13px;
        line-height:1.8;
    }

    .switch{
        width:90px;
        height:34px;
    }
}
.hero-title{

    margin-top:110px; /* below navbar */

    text-align:center;

    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    width:100%;
}

@media(max-width:768px){

    .hero-title{

        margin-top:90px;

        font-size:24px;

        letter-spacing:2px;
    }
}
.typing-paragraph{

    width:90%;
    max-width:1000px;

    margin:35px auto 60px;

    color:#f8e7ff;

    font-size:18px;

    line-height:2.1;

    text-align:justify;

    text-indent:40px;
}


@media(max-width:768px){

    .typing-paragraph{

        width:92%;

        font-size:13px;

        line-height:1.9;

        text-indent:25px;
    }
}
.typing-paragraph{
    white-space:pre-wrap;
}
.switch-text{
    position:relative;
    z-index:5;
}

.switch-text span{
    cursor:pointer;
    user-select:none;
}
</style>
</head>
<body>

<!-- NAVBAR -->

<div class="top-bar">

    <div class="top-left">

        <video class="nav-logo-video" autoplay muted loop playsinline>
            <source src="video2.webm" type="video/webm">
        </video>

    </div>

    <div class="top-right">

        <div class="switch" id="langSwitch">

            <div class="switch-circle"></div>

            <div class="switch-text">
                <span id="englishBtn">ENG</span>
                <span id="teluguBtn">తెలుగు</span>
            </div>

        </div>

    </div>

</div>
<div class="hero-title">
    MAKEUP
</div>
<div class="typing-paragraph">
    <span id="typingText"></span>
</div>
<script>

const englishText = `Magua Makeup Studio offers complete beauty, bridal, and grooming services designed to enhance confidence and elegance for every occasion. Our professional team specializes in Bridal Makeup, Reception Makeup, Engagement Makeup, Party Makeup, HD Makeup, Glossy Makeup, Matte Makeup, and Customized Beauty Looks tailored to individual preferences and skin types.

Our mission is to make every client look and feel beautiful, confident, and radiant through premium beauty solutions and exceptional service.`;
const teluguText = `మగువ మేకప్ స్టూడియోలో ప్రతి ప్రత్యేక సందర్భానికి అనుగుణంగా పూర్తి స్థాయి బ్యూటీ, బ్రైడల్ మరియు గ్రూమింగ్ సేవలు అందుబాటులో ఉన్నాయి. మా నిపుణులు బ్రైడల్ మేకప్, రిసెప్షన్ మేకప్, ఎంగేజ్‌మెంట్ మేకప్, పార్టీ మేకప్, హెచ్‌డీ మేకప్, గ్లోసీ మేకప్, మ్యాట్ మేకప్ మరియు వ్యక్తిగత అవసరాలకు అనుగుణంగా కస్టమైజ్డ్ మేకప్ సేవలను అందిస్తారు.

వధువుల కోసం ప్రత్యేకంగా బ్రైడల్ మేకప్, హెయిర్ స్టైలింగ్, చీర డ్రేపింగ్, జ్యువెలరీ సెట్టింగ్ మరియు పూర్తి గ్రూమింగ్ సేవలను అందిస్తూ పెళ్లి రోజున అద్భుతమైన రూపాన్ని కల్పిస్తాము. అదనంగా ఎంగేజ్‌మెంట్లు, రిసెప్షన్లు, సీమంతాలు, పండుగలు, కుటుంబ వేడుకలు, ఫోటోషూట్లు మరియు ఇతర ప్రత్యేక కార్యక్రమాల కోసం మేకప్ సేవలు అందిస్తున్నాము.

మా స్కిన్ కేర్ సేవలలో ప్రీమియం ఫేషియల్స్, హైడ్రా ఫేషియల్స్, క్లీనప్‌లు, కెమికల్ పీల్స్, స్కిన్ బ్రైటెనింగ్ ట్రీట్‌మెంట్స్, యాక్నీ కేర్ ట్రీట్‌మెంట్స్, యాంటీ ఏజింగ్ ట్రీట్‌మెంట్స్ మరియు లో లెవల్ లేజర్ థెరపీ వంటి ఆధునిక సేవలు అందుబాటులో ఉన్నాయి.

హెయిర్ కేర్ సేవలలో హెయిర్ స్పా, హైడ్రా హెయిర్ స్పా, హెయిర్ కట్స్, హెయిర్ ట్రిమ్స్, హెయిర్ స్టైలింగ్, హెయిర్ స్మూతెనింగ్ మరియు స్కాల్ప్ కేర్ ట్రీట్‌మెంట్స్ ఉన్నాయి. ప్రతి సేవ మీ జుట్టు ఆరోగ్యంగా, అందంగా ఉండేలా రూపొందించబడింది.

థ్రెడింగ్, వాక్సింగ్, డీటాన్ సేవలు, ఐబ్రో షేపింగ్ మరియు పూర్తి బ్యూటీ పార్లర్ సేవలను కూడా అందిస్తున్నాము. వివాహాలు, ప్రత్యేక వేడుకలు లేదా వ్యక్తిగత సంరక్షణ కోసం మగువ మేకప్ స్టూడియో మీకు అత్యుత్తమ అందం మరియు సేవలను అందిస్తుంది.

ప్రతి కస్టమర్ ఆత్మవిశ్వాసంగా, అందంగా మరియు కాంతివంతంగా కనిపించేందుకు అత్యుత్తమ నాణ్యతతో సేవలు అందించడం మా లక్ష్యం.`;
let typingTimer;

function startTyping(text){

    clearTimeout(typingTimer);

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    let i = 0;

    function type(){

        if(i < text.length){

            typingBox.innerHTML += text.charAt(i);

            i++;

            typingTimer = setTimeout(type,12);
        }

    }

    type();
}

/* Page Load */

window.onload = function(){

    startTyping(englishText);

};

/* Language Switch */

const englishBtn = document.getElementById("englishBtn");
const teluguBtn = document.getElementById("teluguBtn");
const circle = document.querySelector(".switch-circle");

let isEnglish = true;

document.getElementById("langSwitch").addEventListener("click",function(){

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    if(isEnglish){

        circle.style.left = "48px";

        englishBtn.style.color = "white";
        teluguBtn.style.color = "#5e3984";

        startTyping(teluguText);

    }else{

        circle.style.left = "3px";

        englishBtn.style.color = "#5e3984";
        teluguBtn.style.color = "white";

        startTyping(englishText);
    }

    isEnglish = !isEnglish;

});

</script>
</body>
</html>
