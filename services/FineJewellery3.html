<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magua Sarees</title>

<link href="https://fonts.cdnfonts.com/css/azonix" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    background:#5e3984;

    font-family:Arial,sans-serif;
}
/* NAVBAR */

.top-bar{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;

    height:70px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.12);

    border-radius:18px;

    z-index:1000;
}

.top-left{
    position:absolute;
    top:50%;
    left:20px;
    transform:translateY(-50%);
}

.nav-logo-video{
    width:60px;
    height:60px;
    object-fit:contain;
}

.top-right{
    position:absolute;
    top:50%;
    right:20px;
    transform:translateY(-50%);
}

.switch{
    position:relative;

    width:98px;
    height:36px;

    background:rgba(255,255,255,0.12);

    border-radius:50px;

    display:flex;
    align-items:center;

    padding:3px;

    cursor:pointer;
}

.switch-circle{
    position:absolute;

    width:42px;
    height:30px;

    background:white;

    border-radius:50px;

    left:3px;

    transition:.3s ease;
}

.switch-text{
    position:relative;

    width:100%;

    display:flex;

    z-index:2;
}

.switch-text span{
    width:50%;

    text-align:center;

    line-height:30px;

    font-size:10px;

    font-weight:600;
}

#englishBtn{
    color:#5e3984;
}

#teluguBtn{
    color:white;
}

/* PAGE CONTENT */

.hero{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:100px 20px 20px;
}

.hero h1{
    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    margin-bottom:25px;

    text-align:center;
}

.hero p{
    max-width:900px;

    text-align:center;

    color:#f8e7ff;

    font-size:18px;

    line-height:2;
}

/* MOBILE */

@media(max-width:768px){

    .top-bar{
        height:60px;
    }

    .nav-logo-video{
        width:50px;
        height:50px;
    }

    .hero h1{
        font-size:22px;
        letter-spacing:2px;
    }

    .hero p{
        font-size:13px;
        line-height:1.8;
    }

    .switch{
        width:90px;
        height:34px;
    }
}
.hero-title{

    margin-top:110px; /* below navbar */

    text-align:center;

    color:white;

    font-family:'Azonix',sans-serif;

    font-size:52px;

    letter-spacing:6px;

    width:100%;
}

@media(max-width:768px){

    .hero-title{

        margin-top:90px;

        font-size:24px;

        letter-spacing:2px;
    }
}
.typing-paragraph{

    width:90%;
    max-width:1000px;

    margin:35px auto 60px;

    color:#f8e7ff;

    font-size:18px;

    line-height:2.1;

    text-align:justify;

    text-indent:40px;
}


@media(max-width:768px){

    .typing-paragraph{

        width:92%;

        font-size:13px;

        line-height:1.9;

        text-indent:25px;
    }
}
.typing-paragraph{
    white-space:pre-wrap;
}
.switch-text{
    position:relative;
    z-index:5;
}

.switch-text span{
    cursor:pointer;
    user-select:none;
}
.nav-logo-img{
    width:60px;
    height:60px;

    object-fit:contain;

    display:block;
}

@media(max-width:768px){

    .nav-logo-img{
        width:45px;
        height:45px;
    }

}
</style>
</head>
<body>

<!-- NAVBAR -->

<div class="top-bar">

    <div class="top-left">

         <img
    class="nav-logo-img"
    src="magualogo.webp"
    alt="MAGUA ETHNICS"
>

    </div>

    <div class="top-right">

        <div class="switch" id="langSwitch">

            <div class="switch-circle"></div>

            <div class="switch-text">
                <span id="englishBtn">ENG</span>
                <span id="teluguBtn">తెలుగు</span>
            </div>

        </div>

    </div>

</div>
<div class="hero-title">
    FINE JEWELLERY
</div>
<div class="typing-paragraph">
    <span id="typingText"></span>
</div>
<script>
const englishText = `Magua Ethnics presents an exquisite Fine Jewellery collection designed to complement every traditional and contemporary outfit with elegance and sophistication. Our carefully curated collections feature Necklaces, Long Necklaces, Earrings, Bangles, Maang Tikkas, Haarams, Jadau Kundan Sets, Polki Sets, Rajwadi Sets, AD Jewellery, Vaddanams, and premium bridal jewellery crafted for every special occasion.

Our Necklace and Long Necklace collections showcase intricate craftsmanship, elegant designs, and timeless beauty suitable for weddings, receptions, festive celebrations, and family gatherings. Earrings and Bangles are available in a variety of traditional and contemporary styles to perfectly enhance every look.

For brides, our exclusive Bridal Jewellery collection includes stunning Maang Tikkas, Haarams, Vaddanams, and complete jewellery sets designed to create a regal and unforgettable appearance. Every piece is selected with attention to detail, quality, and elegance to make your special day even more memorable.

Our Jadau Kundan Sets reflect the richness of royal heritage with intricate artistry and luxurious detailing. Polki Sets offer timeless charm with classic designs inspired by traditional Indian craftsmanship. Rajwadi Sets showcase majestic beauty and royal elegance, making them ideal for grand occasions and wedding celebrations.

We also offer premium AD Jewellery collections that combine modern fashion trends with affordability and sophistication. These designs are perfect for parties, receptions, festive occasions, and everyday elegance.

At Magua Ethnics, we believe jewellery is more than an accessory—it is an expression of beauty, culture, and individuality. Every piece in our collection is chosen to inspire confidence, grace, and timeless elegance while helping every woman shine on every occasion.`;

const teluguText = `మగువ ఎథ్నిక్స్‌లో ప్రత్యేకంగా ఎంపిక చేసిన ఫైన్ జ్యువెలరీ కలెక్షన్లు అందుబాటులో ఉన్నాయి. మా కలెక్షన్లలో నెక్లెస్‌లు, లాంగ్ నెక్లెస్‌లు, చెవిపోగులు, గాజులు, మాంగ్ టిక్కాలు, హారాలు, జడౌ కుందన్ సెట్లు, పోల్కీ సెట్లు, రాజ్వాడీ సెట్లు, ఏడి జ్యువెలరీ, వడ్డాణాలు మరియు ప్రత్యేక బ్రైడల్ జ్యువెలరీ కలెక్షన్లు ఉన్నాయి.

మా నెక్లెస్ మరియు లాంగ్ నెక్లెస్ కలెక్షన్లు అద్భుతమైన డిజైన్లు, నాణ్యమైన పనితనం మరియు శాశ్వతమైన అందంతో రూపొందించబడ్డాయి. చెవిపోగులు మరియు గాజులు సంప్రదాయ మరియు ఆధునిక డిజైన్లలో అందుబాటులో ఉండి ప్రతి దుస్తుకు మరింత అందాన్ని జోడిస్తాయి.

వధువుల కోసం ప్రత్యేకంగా రూపొందించిన బ్రైడల్ జ్యువెలరీ కలెక్షన్లలో మాంగ్ టిక్కాలు, హారాలు, వడ్డాణాలు మరియు పూర్తి జ్యువెలరీ సెట్లు ఉన్నాయి. ప్రతి ఆభరణం నాణ్యత, అందం మరియు ప్రత్యేకతను దృష్టిలో ఉంచుకొని ఎంపిక చేయబడింది.

జడౌ కుందన్ సెట్లు రాజసమైన సంప్రదాయ కళాత్మకతను ప్రతిబింబిస్తాయి. పోల్కీ సెట్లు భారతీయ వారసత్వానికి ప్రతీకగా నిలుస్తూ శాశ్వతమైన అందాన్ని అందిస్తాయి. రాజ్వాడీ సెట్లు రాజరికపు వైభవాన్ని ప్రతిబింబిస్తూ వివాహాలు మరియు ప్రత్యేక వేడుకలకు అద్భుతమైన ఎంపికగా నిలుస్తాయి.

మా ఏడి జ్యువెలరీ కలెక్షన్లు ఆధునిక ఫ్యాషన్ ట్రెండ్స్ మరియు అందమైన డిజైన్ల సమ్మేళనంగా రూపొందించబడ్డాయి. పార్టీలు, రిసెప్షన్లు, పండుగలు మరియు ఇతర ప్రత్యేక సందర్భాలకు ఇవి ఎంతో అనుకూలంగా ఉంటాయి.

మగువ ఎథ్నిక్స్‌లో జ్యువెలరీ అనేది కేవలం ఆభరణం మాత్రమే కాదు, అది అందం, సంస్కృతి మరియు వ్యక్తిత్వానికి ప్రతీక. ప్రతి మహిళ ప్రతి సందర్భంలో ఆత్మవిశ్వాసంగా, అందంగా మరియు ప్రత్యేకంగా కనిపించేలా మా జ్యువెలరీ కలెక్షన్లు రూపొందించబడ్డాయి.`;

let typingTimer;

function startTyping(text){

    clearTimeout(typingTimer);

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    let i = 0;

    function type(){

        if(i < text.length){

            typingBox.innerHTML += text.charAt(i);

            i++;

            typingTimer = setTimeout(type,12);
        }

    }

    type();
}

/* Page Load */

window.onload = function(){

    startTyping(englishText);

};

/* Language Switch */

const englishBtn = document.getElementById("englishBtn");
const teluguBtn = document.getElementById("teluguBtn");
const circle = document.querySelector(".switch-circle");

let isEnglish = true;

document.getElementById("langSwitch").addEventListener("click",function(){

    const typingBox = document.getElementById("typingText");

    typingBox.innerHTML = "";

    if(isEnglish){

        circle.style.left = "48px";

        englishBtn.style.color = "white";
        teluguBtn.style.color = "#5e3984";

        startTyping(teluguText);

    }else{

        circle.style.left = "3px";

        englishBtn.style.color = "#5e3984";
        teluguBtn.style.color = "white";

        startTyping(englishText);
    }

    isEnglish = !isEnglish;

});

</script>
</body>
</html>
